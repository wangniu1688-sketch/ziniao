<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紫鸟浏览器 · 启动器</title>
<link rel="stylesheet" href="/static/web/style.css">
</head>
<body>

<!-- 登录页 -->
<div id="login-view" class="login-wrap hidden">
  <form class="login-card" onsubmit="return doLogin(event)">
    <div class="login-brand">紫鸟浏览器</div>
    <h1>账号安全管理系统</h1>
    <p class="muted">启动器 · 本机环境管理</p>
    <label>用户名 <input id="login-user" autocomplete="username" required></label>
    <label>口令 <input id="login-pass" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">登 录</button>
    <p id="login-err" class="error"></p>
    <p class="muted small">演示账号：demo / Zn@12345678（另有 finance / operator）</p>
  </form>
</div>

<!-- 主界面 -->
<div id="app-view" class="hidden">
  <aside class="sidebar">
    <div class="brand">紫鸟 · 启动器</div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="whoami" class="muted small"></div>
      <button class="link" onclick="logout()">退出登录</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h2 id="section-title"></h2>
      <span id="section-note" class="muted small"></span>
    </header>
    <section id="content"></section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/static/web/app.js"></script>
</body>
</html>
