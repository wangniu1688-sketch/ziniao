name: Windows Client Build

on:
  push:
    branches:
      - product/proxyops-mvp
    paths:
      - "client/**"
      - "cmd/ziniao-proxy/**"
      - ".github/workflows/windows-client.yml"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches:
      - product/proxyops-mvp
    paths:
      - "client/**"
      - "cmd/ziniao-proxy/**"
      - ".github/workflows/windows-client.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-client:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build proxy sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force client/src-tauri/sidecar | Out-Null
          go build -trimpath -o client/src-tauri/sidecar/ziniao-proxy.exe ./cmd/ziniao-proxy

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Build NSIS installer
        working-directory: client
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ziniao-windows-nsis
          path: client/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
