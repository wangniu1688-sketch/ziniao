[package]
name = "ziniao-client"
version = "0.2.0"
description = "紫鸟浏览器管理系统 - 桌面客户端"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ziniao_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地前置代理由 Go 侧 ziniao-proxy 提供（保证 TLS 指纹与内核基线同源）。
# Rust 侧只负责进程管理，避免"客户端自己造 TLS"导致的指纹脱钩（L2）。
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
